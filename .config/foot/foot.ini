[main]
font=JetBrainsMono Nerd Font:size=10.5
dpi-aware=yes
pad=12x10
term=xterm-256color

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors-dark]
# 80% opacity
alpha=0.88
cursor=10100e ff2400

# Primary
background=10100e
foreground=c6c6c4

# Selection — purple
selection-foreground=fffafa
selection-background=9d00ff

# Normal
regular0=10100e
regular1=c40233
regular2=ff3300
regular3=b026ff
regular4=9d00ff
regular5=9a4eae
regular6=20b2aa
regular7=c6c6c4

# Bright
bright0=696969
bright1=ff2400
bright2=03c03c
bright3=ffd700
bright4=8a2be2
bright5=ff1493
bright6=00cccc
bright7=fffafa

# URL
urls=ff1493

# Search
search-box-no-match=10100e c40233
search-box-match=10100e b026ff

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
