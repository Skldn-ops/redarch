background {
  monitor =
  path = screenshot
  blur_passes = 3
  blur_size = 6
  brightness = 0.7
  vibrancy = 0.2
}
label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  font_family = JetBrainsMono Nerd Font
  font_size = 119
  color = rgba(240,231,244,1.0)
  position = 0, 140
  halign = center
  valign = center
}
# Блок для раскладки (чуть ниже времени)
label {
  monitor =
  text = $LAYOUT
  font_family = JetBrainsMono Nerd Font
  font_size = 38
  color = rgba(240,231,244,0.7)
  position = 0, 30
  halign = center
  valign = center
}
input-field {
  monitor =
  size = 290, 56
  outline_thickness = 2
  outer_color = rgba(184,145,245,0.85)
  inner_color = rgba(16,16,14,0.7)
  font_color = rgba(240,231,244,1.0)
  check_color = rgba(184,145,245,1.0)
  fail_color = rgba(196,2,51,1.0)
  dots_size = 0.25
  dots_spacing = 0.23
  rounding = -1
  fade_on_empty = false
  placeholder_text = <i>Пароль</i>
  position = 0, -55
  halign = center
  valign = center
}
